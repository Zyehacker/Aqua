name: Aqua Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install --no-save --no-package-lock @tauri-apps/cli@latest

      - name: Build Tauri application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Validate generated updater artifacts
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="src-tauri/target/release/bundle"

          echo "Generated release artifacts:"

          find "$BUNDLE" -type f \
            ! -path '*AppDir*' \
            ! -path '*debian*' \
            \( \
              -iname '*.exe' \
              -o -iname '*.exe.sig' \
              -o -iname '*.AppImage' \
              -o -iname '*.AppImage.sig' \
              -o -iname '*.deb' \
              -o -iname '*.deb.sig' \
              -o -iname '*.dmg' \
              -o -iname '*.dmg.sig' \
              -o -iname '*.app.tar.gz' \
              -o -iname '*.app.tar.gz.sig' \
            \) \
            -print | sort

          case "${{ matrix.platform }}" in
            windows)
              test "$(find "$BUNDLE" -type f -iname '*.exe' ! -path '*AppDir*' | wc -l)" -ge 1
              test "$(find "$BUNDLE" -type f -iname '*.exe.sig' ! -path '*AppDir*' | wc -l)" -ge 1
              ;;

            linux)
              test "$(find "$BUNDLE" -type f -iname '*.AppImage' ! -path '*AppDir*' | wc -l)" -ge 1
              test "$(find "$BUNDLE" -type f -iname '*.AppImage.sig' ! -path '*AppDir*' | wc -l)" -ge 1
              ;;

            macos)
              test "$(find "$BUNDLE" -type f -iname '*.app.tar.gz' ! -path '*AppDir*' | wc -l)" -ge 1
              test "$(find "$BUNDLE" -type f -iname '*.app.tar.gz.sig' ! -path '*AppDir*' | wc -l)" -ge 1
              ;;
          esac

          echo "Updater artifacts validated successfully."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqua-${{ matrix.platform }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    env:
      GH_TOKEN: ${{ secrets.AQUA_RELEASES_TOKEN }}
      RELEASE_REPOSITORY: Zyehacker/Aqua-Client-Releases
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Verify release token
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "AQUA_RELEASES_TOKEN is missing."
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: aqua-*
          path: staging
          merge-multiple: false

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-assets
          mkdir -p release-assets

          for platform in windows linux macos; do
            test -d "staging/aqua-${platform}" || {
              echo "Missing build artifact: aqua-${platform}"
              exit 1
            }
          done

          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const staging = path.resolve("staging");
          const output = path.resolve("release-assets");

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          function platformOf(file) {
            const match = file.match(/[\\/]aqua-(windows|linux|macos)[\\/]/);
            if (!match) {
              throw new Error(`Cannot determine platform for: ${file}`);
            }
            return match[1];
          }

          function isIgnored(file) {
            return file.split(path.sep).some(segment => {
              const name = segment.toLowerCase();
              return name.endsWith(".appdir") || name === "debian";
            });
          }

          function isReleaseFile(file) {
            if (isIgnored(file)) return false;

            const name = path.basename(file).toLowerCase();

            return (
              name.endsWith(".exe") ||
              name.endsWith(".appimage") ||
              name.endsWith(".deb") ||
              name.endsWith(".dmg") ||
              name.endsWith(".app.tar.gz")
            );
          }

          const files = walk(staging).filter(isReleaseFile);

          if (!files.length) {
            throw new Error("No release bundle files were found.");
          }

          const copied = new Set();

          for (const file of files) {
            const filename = path.basename(file);

            if (copied.has(filename)) {
              throw new Error(`Duplicate release filename: ${filename}`);
            }

            fs.copyFileSync(file, path.join(output, filename));
            copied.add(filename);

            const signature = `${file}.sig`;

            if (fs.existsSync(signature)) {
              const sigName = `${filename}.sig`;

              if (copied.has(sigName)) {
                throw new Error(`Duplicate signature filename: ${sigName}`);
              }

              fs.copyFileSync(signature, path.join(output, sigName));
              copied.add(sigName);
            }
          }

          function findUpdater(platform, extension) {
            const candidates = files.filter(file => {
              return (
                platformOf(file) === platform &&
                path.basename(file).toLowerCase().endsWith(extension)
              );
            });

            if (candidates.length === 0) {
              throw new Error(
                `Missing ${platform} updater artifact: ${extension}`
              );
            }

            if (candidates.length > 1) {
              throw new Error(
                `Multiple ${platform} updater artifacts found: ${candidates
                  .map(path.basename)
                  .join(", ")}`
              );
            }

            const file = candidates[0];
            const signature = `${file}.sig`;

            if (!fs.existsSync(signature)) {
              throw new Error(
                `Missing signature for ${path.basename(file)}`
              );
            }

            return { file, signature };
          }

          const updater = {
            windows: findUpdater("windows", ".exe"),
            linux: findUpdater("linux", ".appimage"),
            macos: findUpdater("macos", ".app.tar.gz"),
          };

          function architecture(filename) {
            const name = filename.toLowerCase();

            if (
              name.includes("aarch64") ||
              name.includes("arm64")
            ) {
              return "aarch64";
            }

            return "x86_64";
          }

          const platforms = {};

          for (const [platform, data] of Object.entries(updater)) {
            const filename = path.basename(data.file);

            const target =
              platform === "macos"
                ? "darwin"
                : platform;

            platforms[`${target}-${architecture(filename)}`] = {
              signature: fs
                .readFileSync(data.signature, "utf8")
                .trim(),
              url:
                `https://github.com/${process.env.RELEASE_REPOSITORY}` +
                `/releases/download/${process.env.RELEASE_TAG}/${filename}`,
            };
          }

          const latest = {
            version: process.env.RELEASE_TAG.replace(/^v/, ""),
            notes: "",
            pub_date: new Date().toISOString(),
            platforms,
          };

          fs.writeFileSync(
            path.join(output, "latest.json"),
            JSON.stringify(latest, null, 2) + "\n"
          );

          console.log("");
          console.log("Release assets:");

          for (const filename of [...copied].sort()) {
            console.log(`  ${filename}`);
          }

          console.log("");
          console.log("latest.json generated successfully.");
          NODE

          test -s release-assets/latest.json

      - name: Validate latest.json
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const data = JSON.parse(
            fs.readFileSync("release-assets/latest.json", "utf8")
          );

          if (!data.version) throw new Error("latest.json has no version.");
          if (!data.platforms) throw new Error("latest.json has no platforms.");

          for (const target of [
            "windows-x86_64",
            "linux-x86_64",
            "darwin-x86_64"
          ]) {
            const entry = data.platforms[target];

            if (!entry) {
              throw new Error(`Missing platform: ${target}`);
            }

            if (!entry.url) {
              throw new Error(`Missing URL: ${target}`);
            }

            if (!entry.signature) {
              throw new Error(`Missing signature: ${target}`);
            }
          }

          console.log("latest.json validation passed.");
          NODE

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then

            gh release edit "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --title "Aqua Client ${RELEASE_TAG}" \
              --latest

          else

            gh release create "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --title "Aqua Client ${RELEASE_TAG}" \
              --generate-notes \
              --latest

          fi

      - name: Upload release assets
        shell: bash
        run: |
          set -euo pipefail

          gh release upload \
            "$RELEASE_TAG" \
            release-assets/* \
            --repo "$RELEASE_REPOSITORY" \
            --clobber

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY"

          echo ""
          echo "Aqua Client ${RELEASE_TAG} published successfully."

