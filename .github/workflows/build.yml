name: Aqua Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install --save-dev @tauri-apps/cli@latest

      - name: Build Tauri application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Inspect generated bundle files
        shell: bash
        run: |
          set -euo pipefail
          find src-tauri/target/release/bundle -type f \( \
            -iname '*.exe' -o \
            -iname '*.exe.sig' -o \
            -iname '*.AppImage' -o \
            -iname '*.AppImage.sig' -o \
            -iname '*.deb' -o \
            -iname '*.deb.sig' -o \
            -iname '*.dmg' -o \
            -iname '*.dmg.sig' -o \
            -iname '*.app.tar.gz' -o \
            -iname '*.app.tar.gz.sig' \
          \) ! -path '*AppDir*' ! -path '*debian*' ! -path '*DEBIAN*' -print | sort

          case "${{ matrix.platform }}" in
            windows)
              find src-tauri/target/release/bundle -type f -iname '*.exe' -print -quit | grep -q .
              find src-tauri/target/release/bundle -type f -iname '*.exe.sig' -print -quit | grep -q .
              ;;
            linux)
              find src-tauri/target/release/bundle -type f -iname '*.AppImage' -print -quit | grep -q .
              find src-tauri/target/release/bundle -type f -iname '*.AppImage.sig' -print -quit | grep -q .
              ;;
            macos)
              find src-tauri/target/release/bundle -type f -iname '*.app.tar.gz' -print -quit | grep -q .
              find src-tauri/target/release/bundle -type f -iname '*.app.tar.gz.sig' -print -quit | grep -q .
              ;;
          esac

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqua-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.AQUA_RELEASES_TOKEN }}
      RELEASE_REPOSITORY: Zyehacker/Aqua-Client-Releases
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Require destination repository token
        shell: bash
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "AQUA_RELEASES_TOKEN is required to publish to ${RELEASE_REPOSITORY}."
            exit 1
          fi

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: aqua-*
          path: staging
          merge-multiple: false

      - name: Collect release assets and build updater metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          for platform in windows linux macos; do
            if [[ ! -d "staging/aqua-${platform}" ]]; then
              echo "Missing aqua-${platform} matrix artifact."
              exit 1
            fi
          done

          RELEASE_ASSETS_DIR="$PWD/release-assets" node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const staging = path.resolve('staging')
          const assetsDir = process.env.RELEASE_ASSETS_DIR
          const repository = process.env.RELEASE_REPOSITORY
          const tag = process.env.RELEASE_TAG

          function walk(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const fullPath = path.join(directory, entry.name)
              return entry.isDirectory() ? walk(fullPath) : [fullPath]
            })
          }

          function platformFor(file) {
            const directory = file.split(path.sep).find((segment) => segment.startsWith('aqua-'))
            if (!directory) throw new Error(`Unable to determine matrix platform for ${file}.`)
            return directory.replace(/^aqua-/, '')
          }

          function isInternalFile(file) {
            return file.split(path.sep).some((segment) => {
              const lower = segment.toLowerCase()
              return lower.endsWith('appdir') || lower === 'debian'
            })
          }

          function isBundleFile(file) {
            if (isInternalFile(file)) return false
            const name = path.basename(file).toLowerCase()
            return name.endsWith('.exe') || name.endsWith('.appimage') || name.endsWith('.deb') || name.endsWith('.dmg') || name.endsWith('.app.tar.gz')
          }

          const bundleFiles = walk(staging).filter(isBundleFile)
          if (!bundleFiles.length) throw new Error('No distributable Tauri bundle files were generated.')

          const copied = new Set()
          for (const bundlePath of bundleFiles) {
            const filename = path.basename(bundlePath)
            if (copied.has(filename)) throw new Error(`Duplicate release asset filename: ${filename}`)
            copied.add(filename)
            fs.copyFileSync(bundlePath, path.join(assetsDir, filename))

            const signaturePath = `${bundlePath}.sig`
            if (fs.existsSync(signaturePath)) {
              const signatureFilename = `${filename}.sig`
              if (copied.has(signatureFilename)) throw new Error(`Duplicate release asset filename: ${signatureFilename}`)
              copied.add(signatureFilename)
              fs.copyFileSync(signaturePath, path.join(assetsDir, signatureFilename))
            }
          }

          console.log('Generated distributable bundle files:')
          for (const filename of [...copied].sort()) console.log(`- ${filename}`)

          function selectUpdaterArtifact(platform, suffix) {
            const candidates = bundleFiles.filter((file) => platformFor(file) === platform && path.basename(file).toLowerCase().endsWith(suffix))
            if (!candidates.length) throw new Error(`Missing ${platform} updater artifact matching ${suffix}.`)
            const selected = candidates.find((file) => path.basename(file).toLowerCase().includes('setup')) ?? candidates[0]
            const signaturePath = `${selected}.sig`
            if (!fs.existsSync(signaturePath)) throw new Error(`Missing signature for updater artifact ${path.basename(selected)}.`)
            return { file: selected, signaturePath }
          }

          const updaterArtifacts = {
            windows: selectUpdaterArtifact('windows', '.exe'),
            linux: selectUpdaterArtifact('linux', '.appimage'),
            macos: selectUpdaterArtifact('macos', '.app.tar.gz'),
          }

          const platforms = {}
          for (const [platform, updater] of Object.entries(updaterArtifacts)) {
            const filename = path.basename(updater.file)
            const os = platform === 'macos' ? 'darwin' : platform
            const arch = /(?:aarch64|arm64)/i.test(filename) ? 'aarch64' : 'x86_64'
            platforms[`${os}-${arch}`] = {
              signature: fs.readFileSync(updater.signaturePath, 'utf8').trim(),
              url: `https://github.com/${repository}/releases/download/${tag}/${filename}`,
            }
          }
          const version = tag.replace(/^v/, '')
          const latest = { version, notes: '', pub_date: new Date().toISOString(), platforms }
          fs.writeFileSync(path.join(assetsDir, 'latest.json'), `${JSON.stringify(latest, null, 2)}\n`)
          NODE

          test -s release-assets/latest.json

      - name: Create or update destination release
        shell: bash
        run: |
          set -euo pipefail
          release_args=(--repo "$RELEASE_REPOSITORY" --title "Aqua Client ${RELEASE_TAG}")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi

          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${release_args[@]}"
          else
            gh release create "$RELEASE_TAG" "${release_args[@]}" --generate-notes
          fi

      - name: Upload destination release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$RELEASE_REPOSITORY" --clobber